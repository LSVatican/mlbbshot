<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Favicon dari file yang diupload ke Spck Editor -->
  <link rel="icon" href="/favicon.jpg" type="image/jpg">
  <title>Pemutar Video Elegan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Halaman Utama -->
  <div id="main-page" class="container">
    <h1 class="title">Untuk anda</h1>
    
    <!-- Tombol Pemutar di Halaman Utama -->
    <button id="start-btn" class="btn">Putar Video</button>
    
    <!-- Label Hak Cipta / Pembuat -->
    <div class="footer-label">Created by Daus Dopo</div>
  </div>

  <!-- Layer Loading Bar -->
  <div id="loading-screen" class="hidden">
    <div class="loading-box">
      <p class="loading-text">Memuat Video...</p>
      <div class="progress-bar-container">
        <div id="progress-bar"></div>
      </div>
      <p id="percentage-text">0%</p>
    </div>
  </div>

  <!-- Pemutar Video Fullscreen -->
  <div id="video-container" class="hidden">
    <video id="my-video" playsinline>
      <!-- Ganti link video di bawah ini sesuai video Anda -->
      <source src="video.mp4" type="video/mp4">
      Browser Anda tidak mendukung pemutaran video.
    </video>
  </div>

  <script src="script.js"></script>
</body>
</html>
